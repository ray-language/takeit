# takeit RELEASE pipeline. Pushing a `vX.Y.Z` tag builds the native binary for every
# supported platform and uploads it to that tag's GitHub Release.
#
# The raylang toolchain is the release pinned in ray.toml (`raylang = "X.Y.Z"`),
# downloaded prebuilt for each runner's target from ray-language/raylang's Releases:
# CI tests and builds with exactly the `ray` the project was validated against, not
# whatever raylang's main happens to be. takeit has no path deps, so the project
# only needs `ray` on PATH (plus cargo for `--native`, which fetches the ray-runtime
# crates on the first build).
#
# Every platform compiles NATIVELY on its own runner. `ray build --release` adds
# `-C target-cpu=native` unless `--target` is given, which would produce binaries
# that fault on older CPUs; passing the runner's own triple keeps the release
# profile (opt3 + fat LTO + codegen-units=1) while staying portable.
#
# Assets carry no version in their name (`takeit-<target>.tar.gz`), so install.sh
# can fetch `releases/latest/download/...` without going through the GitHub API.
name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build and publish the artifacts to the run itself, without touching
  # any Release — useful to check the pipeline before cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create (or reuse, if it already exists) the tag's Release, with generated notes.
  # A single job so the matrix legs do not race each other creating it.
  create-release:
    name: create the tag's Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches ray.toml
        run: |
          manifest="$(sed -n 's/^version *= *"\(.*\)"/\1/p' ray.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ray.toml version $manifest"
            exit 1
          fi
          echo "version $manifest"
      - name: Create the Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "takeit $GITHUB_REF_NAME" \
                 --generate-notes

  build:
    name: build ${{ matrix.target }}
    # `always()` keeps the manual (no-tag) run going, where create-release is skipped.
    needs: create-release
    if: always() && needs.create-release.result != 'failure'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-14,         target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out takeit
        uses: actions/checkout@v4

      - name: Install Rust stable + target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install the pinned raylang release
        shell: bash
        run: |
          version="$(sed -n 's/^raylang *= *"\(.*\)"/\1/p' ray.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::ray.toml does not pin a raylang version"
            exit 1
          fi
          url="https://github.com/ray-language/raylang/releases/download/v$version/raylang-${{ matrix.target }}.tar.gz"
          echo "raylang $version from $url"
          dir="$RUNNER_TEMP/raylang"
          mkdir -p "$dir"
          curl -sSfL --retry 3 "$url" | tar xz -C "$dir"
          if ! "$dir/ray" version | grep -qxF "raylang $version"; then
            echo "::error::downloaded ray reports '$("$dir/ray" version | head -1)', expected raylang $version"
            exit 1
          fi
          echo "$dir" >>"$GITHUB_PATH"
          echo "RAYLANG_VERSION=$version" >>"$GITHUB_ENV"

      # The native build compiles the ray-runtime crates; cache them per raylang release.
      - name: Cache the native build's crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ray-native-${{ matrix.target }}-${{ env.RAYLANG_VERSION }}
          restore-keys: ray-native-${{ matrix.target }}-

      # Informational: it exits 1 when anything optional (extra targets, the offline
      # vendor) is missing, which the build below does not need.
      - name: ray toolchain status
        run: |
          ray version
          ray toolchain status || true

      - name: Run the test suite
        run: ray test

      # `--target` is the runner's own triple: a native build, but without the
      # `target-cpu=native` that `--release` alone would bake in.
      - name: Build the native binary
        shell: bash
        run: |
          mkdir -p dist
          ray build --native -o dist/takeit --release --target ${{ matrix.target }}
          ls -la dist/takeit

      - name: Package (tar.gz + sha256)
        id: package
        shell: bash
        run: |
          asset="takeit-${{ matrix.target }}.tar.gz"
          tar czf "$asset" -C dist takeit
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "asset=$asset" >>"$GITHUB_OUTPUT"

      # Kept for manual runs, and handy for inspecting a tagged build after the fact.
      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: takeit-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

      - name: Upload the asset to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
