# takeit RELEASE pipeline. Pushing a `vX.Y.Z` tag builds the native binary for every
# supported platform and uploads it to that tag's GitHub Release.
#
# The raylang toolchain is the release pinned in ray.toml (`raylang = "X.Y.Z"`),
# downloaded prebuilt for each runner's target (.github/actions/setup-ray, shared with
# ci.yml): releases are tested and built with exactly the `ray` the project was
# validated against, not whatever raylang's main happens to be.
#
# Every platform compiles NATIVELY on its own runner. `ray build --release` adds
# `-C target-cpu=native` unless `--target` is given, which would produce binaries
# that fault on older CPUs; passing the runner's own triple keeps the release
# profile (opt3 + fat LTO + codegen-units=1) while staying portable.
#
# Assets carry no version in their name (`takeit-<target>.tar.gz`, `.zip` on Windows), so
# install.sh can fetch `releases/latest/download/...` without going through the GitHub API.
name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build and publish the artifacts to the run itself, without touching
  # any Release — useful to check the pipeline before cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create (or reuse, if it already exists) the tag's Release, with generated notes.
  # A single job so the matrix legs do not race each other creating it.
  create-release:
    name: create the tag's Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches ray.toml
        run: |
          manifest="$(sed -n 's/^version *= *"\(.*\)"/\1/p' ray.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ray.toml version $manifest"
            exit 1
          fi
          echo "version $manifest"
      - name: Create the Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "takeit $GITHUB_REF_NAME" \
                 --generate-notes

  build:
    name: build ${{ matrix.target }}
    # `always()` keeps the manual (no-tag) run going, where create-release is skipped.
    needs: create-release
    if: always() && needs.create-release.result != 'failure'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  exe: takeit,     pack: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: takeit,     pack: tar.gz }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       exe: takeit,     pack: tar.gz }
          - { os: macos-14,         target: aarch64-apple-darwin,      exe: takeit,     pack: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    exe: takeit.exe, pack: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,   exe: takeit.exe, pack: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out takeit
        uses: actions/checkout@v4

      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: ${{ matrix.target }}

      - name: Run the test suite
        shell: bash
        run: ray test

      # `--target` is the runner's own triple: a native build, but without the
      # `target-cpu=native` that `--release` alone would bake in.
      - name: Build the native binary
        shell: bash
        run: |
          mkdir -p dist
          ray build --native -o dist/${{ matrix.exe }} --release --target ${{ matrix.target }}
          ls -la dist/${{ matrix.exe }}

      - name: Package (tar.gz or zip + sha256)
        id: package
        shell: bash
        run: |
          asset="takeit-${{ matrix.target }}.${{ matrix.pack }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.exe }}' -DestinationPath '$asset'"
          else
            tar czf "$asset" -C dist ${{ matrix.exe }}
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"$asset.sha256"
          else
            shasum -a 256 "$asset" >"$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "asset=$asset" >>"$GITHUB_OUTPUT"

      # Kept for manual runs, and handy for inspecting a tagged build after the fact.
      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: takeit-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

      - name: Upload the asset to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
