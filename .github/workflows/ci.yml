# takeit CI: every pull request and every push to master runs the test suite on each
# platform takeit ships for, on the VM and as native binaries, with the raylang release
# pinned in ray.toml (.github/actions/setup-ray). Releases are release.yml's job.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: ray fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: x86_64-unknown-linux-gnu
      # `ray fmt` prints the canonical version: any difference is an unformatted file.
      - name: Check that every source is formatted
        shell: bash
        run: |
          status=0
          for f in src/*.ray tests/*.ray; do
            if ! ray fmt "$f" | diff -u "$f" - >/dev/null; then
              echo "::error file=$f::not formatted (run: ray fmt -w $f)"
              status=1
            fi
          done
          exit $status

  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-14,         target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: ${{ matrix.target }}
      - name: Tests (VM)
        shell: bash
        run: ray test
      # The binaries users get are native: the suite also runs compiled.
      - name: Tests (native)
        shell: bash
        run: ray test --native
